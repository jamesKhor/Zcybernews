name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Force full rebuild even for content-only changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Detect what kind of change was pushed. Content-only = new MDX articles
  # or updated default images. Code = everything else that needs rebuild.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      needs_rebuild: ${{ steps.check.outputs.needs_rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed files
        id: check
        run: |
          # Manual dispatch with force_full_rebuild wins
          if [ "${{ inputs.force_full_rebuild }}" = "true" ]; then
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::notice::force_full_rebuild requested — doing full rebuild"
            exit 0
          fi

          # First commit / no parent → full rebuild
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No parent commit — doing full rebuild"
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Safety: if the diff is empty (force-push, weird merge, dispatch
          # without a real change), fall back to full rebuild. Better to do
          # a needless rebuild than to silently "succeed" with no actual
          # work on a divergent VPS.
          if [ -z "$CHANGED" ]; then
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Empty diff between HEAD~1 and HEAD — defaulting to full rebuild"
            exit 0
          fi

          # Deploy runtime changes must exercise the full deploy path. These
          # files decide how the production Next.js process is rebuilt,
          # swapped, and restarted; treating them as content-only can let a
          # "successful" run leave production serving an old runtime.
          if echo "$CHANGED" | grep -q -E '^(\.github/workflows/deploy-vps\.yml|scripts/ops/)'; then
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy runtime change detected — full rebuild needed"
            echo "Files triggering rebuild:"
            echo "$CHANGED" | grep -E '^(\.github/workflows/deploy-vps\.yml|scripts/ops/)' || true
            exit 0
          fi

          # Paths that DON'T require a VPS rebuild — strip them out of the
          # change list; if nothing remains, it's a no-rebuild change.
          #
          # The principle: anything that doesn't affect what the Next.js
          # process serves at runtime should skip the full rebuild. The
          # VPS still pulls the files (so local backup scripts stay in
          # sync), but PM2 keeps serving traffic uninterrupted.
          #
          #   Content (served via ISR, regenerated on request):
          #     content/                    → MDX articles
          #     public/images/articles/     → article hero images
          #     .pipeline-cache/            → RSS dedup cache
          #     data/                       → subscribers.json, rss-sources.json
          #
          #   CI/CD configuration (runs on GitHub's runners, not the VPS):
          #     .github/workflows/          → workflow YAML files, except
          #                                    deploy-vps.yml above
          #     .github/actions/            → custom composite actions
          #     .github/ISSUE_TEMPLATE/     → issue templates
          #     .github/dependabot.yml, .github/FUNDING.yml, etc. (see root match)
          #
          #   Docs / editor config (not runtime):
          #     docs/                       → documentation (future)
          #     .claude/                    → Claude Code session state
          #     .vscode/                    → editor settings (future)
          #     .idea/                      → JetBrains editor settings (future)
          #
          #   Scripts (run on GitHub Actions OR as separate PM2 processes —
          #   none of them are loaded by the zcybernews Next.js process):
          #     scripts/                    → pipeline, AI provider, telegram bot,
          #                                    except scripts/ops/ above
          #     NOTE: scripts/telegram/bot.mjs is a separate PM2 process
          #     (tg-claude); changes there need manual 'pm2 restart tg-claude'
          #     on the VPS. Not handled by this workflow.
          #
          #   Root-level meta (not runtime):
          #     Any root *.md (README, CLAUDE, AGENTS, CHANGELOG...)
          #     LICENSE, .gitignore, .env.example, .editorconfig,
          #     .prettierignore, vercel.json (Vercel-only config)
          NON_CONTENT=$(echo "$CHANGED" \
            | grep -v -E '^(content/|public/images/articles/|\.pipeline-cache/|data/)' \
            | grep -v -E '^\.github/(workflows|actions|ISSUE_TEMPLATE)/' \
            | grep -v -E '^(docs|\.claude|\.vscode|\.idea|scripts)/' \
            | grep -v -E '^[^/]+\.md$' \
            | grep -v -E '^(LICENSE|\.gitignore|\.env\.example|\.editorconfig|\.prettierignore|vercel\.json)$' \
            | grep -v -E '^\.github/[^/]+\.(yml|yaml)$' \
            || true)

          if [ -z "$NON_CONTENT" ]; then
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No runtime changes — skipping rebuild, will revalidate instead"
          else
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Code/config change detected — full rebuild needed"
            echo "Files triggering rebuild:"
            echo "$NON_CONTENT"
          fi

  # Content-only path: git pull + revalidate. ~10 seconds, zero downtime.
  content-only:
    name: Content sync (no rebuild)
    needs: classify
    if: needs.classify.outputs.needs_rebuild == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Pull + revalidate on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: zcybernews
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -e
            cd /home/zcybernews/zcybernews

            echo "⬇️  Pulling latest content..."
            for attempt in 1 2 3; do
              if git fetch origin main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::git fetch failed after 3 attempts"
                exit 1
              fi
              echo "::warning::git fetch attempt $attempt failed; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            git reset --hard origin/main
            # The sitemap is generated from content on disk. Remove stale
            # untracked MDX that can survive reset and keep deleted URLs live.
            git clean -fd -- content/en/posts content/en/threat-intel content/zh/posts content/zh/threat-intel

            echo "🔎 Regenerating public discovery artifacts..."
            npm run feed:index
            npm run search:index

            echo "🔄 Triggering ISR revalidation..."
            SECRET=$(grep '^REVALIDATE_SECRET=' .env.local | cut -d= -f2-)
            if [ -z "$SECRET" ]; then
              echo "::error::[ACTION REQUIRED] REVALIDATE_SECRET is missing from .env.local on the VPS."
              echo "::error::New MDX files were pulled to disk but the ISR cache was NOT cleared."
              echo "::error::Articles will sit stale for up to 1h until ISR TTL expires."
              echo "::error::Fix: SSH to VPS and add to /home/zcybernews/zcybernews/.env.local:"
              echo "::error::  REVALIDATE_SECRET=<value matching the GitHub Actions REVALIDATE_SECRET secret>"
              echo "::error::Then re-run this workflow (workflow_dispatch) or wait for the next pipeline push."
              # Exit 1 so the failure Telegram fires — a content-sync that
              # doesn't actually revalidate is functionally broken from the
              # operator's perspective. Silent exit 0 hid this for hours.
              exit 1
            else
              # Retry revalidate up to 3 times with backoff. PM2 cluster
              # reload, brief network blip, or worker mid-restart can all
              # cause a transient curl failure; if we don't retry, articles
              # sit stale for up to 1h until the next ISR refresh. The
              # revalidate endpoint itself is idempotent — calling it
              # multiple times in a row is safe.
              #
              # Keep this in sync with the admin publish route:
              #   - section listings so readers see the article immediately
              #   - /sitemap.xml so Google Search Console sees fresh URLs
              #   - tag=articles for any tagged reads that opt into cache tags
              REVALIDATED=false
              for attempt in 1 2 3; do
                if curl -sf -X POST -H "x-revalidate-secret: $SECRET" \
                    "http://localhost:3000/api/revalidate?tag=articles" > /dev/null \
                  && curl -sf -X POST -H "x-revalidate-secret: $SECRET" \
                    "http://localhost:3000/api/revalidate?path=/en/articles" > /dev/null \
                  && curl -sf -X POST -H "x-revalidate-secret: $SECRET" \
                    "http://localhost:3000/api/revalidate?path=/zh/articles" > /dev/null \
                  && curl -sf -X POST -H "x-revalidate-secret: $SECRET" \
                    "http://localhost:3000/api/revalidate?path=/sitemap.xml" > /dev/null; then
                  echo "✅ Revalidated on attempt $attempt"
                  REVALIDATED=true
                  break
                fi
                echo "::warning::Revalidate attempt $attempt failed; retrying in $((2 * attempt))s"
                sleep $((2 * attempt))
              done
              if [ "$REVALIDATED" != "true" ]; then
                echo "::error::Revalidate failed after 3 attempts. New content is on disk but ISR cache is stale until 1h TTL. Check 'pm2 logs zcybernews' for /api/revalidate errors."
                exit 1
              fi
            fi

            echo "🔎 Verifying latest article discovery surfaces..."
            LATEST_PUBLIC_PATH=$(node --input-type=module <<'NODE'
            import fs from "node:fs";
            import path from "node:path";
            import matter from "gray-matter";
            const roots = [
              ["content/en/posts", "/en/articles"],
              ["content/en/threat-intel", "/en/threat-intel"],
            ];
            const candidates = [];
            for (const [dir, prefix] of roots) {
              if (!fs.existsSync(dir)) continue;
              for (const file of fs.readdirSync(dir)) {
                if (!file.endsWith(".mdx") && !file.endsWith(".md")) continue;
                const parsed = matter(fs.readFileSync(path.join(dir, file), "utf8"));
                const fm = parsed.data ?? {};
                if (fm.draft === true) continue;
                if (fm.publish_tier && !["public", "report"].includes(fm.publish_tier)) continue;
                const slug = fm.slug || file.replace(/\.(mdx|md)$/i, "");
                const date = Date.parse(`${fm.date ?? "1970-01-01"}T23:59:59Z`);
                candidates.push({ path: `${prefix}/${slug}`, date });
              }
            }
            candidates.sort((a, b) => b.date - a.date);
            process.stdout.write(candidates[0]?.path ?? "");
            NODE
            )
            if [ -n "$LATEST_PUBLIC_PATH" ]; then
              curl -sf "http://localhost:3000${LATEST_PUBLIC_PATH}" | grep -q 'name="robots" content="index, follow"' \
                || (echo "::error::Latest article is not indexable at origin: ${LATEST_PUBLIC_PATH}"; exit 1)
              curl -sf "http://localhost:3000/sitemap.xml" | grep -q "$LATEST_PUBLIC_PATH" \
                || (echo "::error::Origin sitemap is missing latest article: ${LATEST_PUBLIC_PATH}"; exit 1)
              curl -sf "https://zcybernews.com/sitemap.xml" | grep -q "$LATEST_PUBLIC_PATH" \
                || (echo "::error::Public sitemap is missing latest article after revalidate: ${LATEST_PUBLIC_PATH}"; exit 1)
              echo "✅ Latest article visible in origin and public sitemap: ${LATEST_PUBLIC_PATH}"
            else
              echo "::warning::No public EN article found for latest discovery check"
            fi

            echo "✅ Content sync complete at $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

      - name: Notify Telegram — content-sync failure
        # Same rationale as full-deploy failure-notify below: silent
        # content-sync failures (git pull error, revalidate exhausting
        # retries, SSH timeout) used to require checking GitHub Actions
        # to discover. Now they ping Telegram.
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          MESSAGE="⚠️ <b>ZCyberNews content-sync deploy failed</b>"
          MESSAGE+=$'\n'"Commit: ${SHA_SHORT}"
          MESSAGE+=$'\n\n'"Run: ${RUN_URL}"
          MESSAGE+=$'\n\n'"New content didn't reach VPS or revalidate failed. Articles will appear after 1h ISR TTL fallback. Check the run for details."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode disable_web_page_preview="true" \
            --data-urlencode text="$MESSAGE" \
            > /dev/null || true

  # Code path: full rebuild + PM2 reload. Only for real code changes.
  #
  # ZERO-DOWNTIME STRATEGY (Option B — build on runner, rsync, cluster reload):
  #
  # Previously: SSH to VPS → pm2 stop → rm .next → npm run build → pm2 start
  # Problem: ~60-90s downtime per code deploy, because building ON the server
  # requires stopping it to avoid file-write races with the running process.
  # Worst: 1 incident 2026-04-17 where operator saw 502 during code deploy.
  #
  # New approach: build on GitHub Actions runner (free, fast, no downtime
  # risk), upload the build artifact, download on VPS into a staging path,
  # atomically swap the .next directory, then `pm2 reload` (cluster rolling
  # update — workers cycle one at a time, old stays serving until new is
  # ready).
  #
  # Why this works where in-place build didn't:
  #   • The running VPS process keeps serving from the OLD .next the entire
  #     time the NEW .next is being prepared — no file races, no ENOENT
  #     errors on lazy-loaded chunks.
  #   • `pm2 reload` (NOT `restart`) does a rolling worker cycle in cluster
  #     mode: worker 0 drains + reboots while worker 1 keeps serving, then
  #     swap. Genuine zero-downtime.
  #   • Atomic directory swap via `mv` (rename is atomic on ext4). Even if
  #     something kills the workflow between rsync and pm2 reload, the old
  #     .next is still in place. Rollback = revert the swap.
  #
  # Memory: the build runs on GitHub's 7GB runner, not the 2GB VPS — so
  # the --max-old-space-size=1536 hack is no longer needed.
  full-deploy:
    name: Full rebuild + zero-downtime reload
    needs: classify
    if: needs.classify.outputs.needs_rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (runner)
        run: npm ci
        env:
          HUSKY: 0

      - name: Build on runner (not VPS)
        run: npm run build
        env:
          # Match VPS runtime — keeps the Zod/runtime errors consistent
          NEXT_PUBLIC_SITE_URL: https://zcybernews.com
          # Pipe through build-time env vars if any future feature needs them.
          # Keep this list explicit — we do NOT want to leak admin secrets
          # into the client bundle.

      - name: Verify build completeness
        run: |
          test -f .next/prerender-manifest.json \
            || (echo "❌ Build missing prerender-manifest.json"; exit 1)
          test -d .next/server \
            || (echo "❌ Build missing .next/server/"; exit 1)
          grep -R "Built by a cybersecurity professional" .next/server .next/static >/dev/null \
            || (echo "❌ Build artifact missing expected homepage copy"; exit 1)
          grep -R "Palo Alto Networks Security Advisories" .next/server .next/static >/dev/null \
            || (echo "❌ Build artifact missing expected vendor source copy"; exit 1)
          echo "✅ Build artifacts look valid"
          du -sh .next

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync build + source to VPS (staging dir)
        run: |
          # Stream the built .next + package.json + node deps-adjacent files
          # into a staging directory on the VPS. This doesn't touch the
          # currently-serving .next at all — that one keeps serving traffic.
          # --delete removes files from the staging dir that are no longer
          # in the build. -z compresses the transfer.
          # We rsync .next and public separately so a partial failure is
          # survivable (the old .next stays until the swap).
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next-staging' \
            --exclude='.next-prev' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./.next/ \
            zcybernews@${{ secrets.VPS_HOST }}:/home/zcybernews/zcybernews/.next-staging/

      - name: Pull code, install deps, atomic swap, reload PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: zcybernews
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/zcybernews/zcybernews

            echo "⬇️  Syncing source code (for server-side reads — content/, app/, lib/, scripts/)..."
            OLD_LOCK_HASH=""
            if [ -f package-lock.json ]; then
              OLD_LOCK_HASH=$(sha256sum package-lock.json | awk '{print $1}')
            fi
            for attempt in 1 2 3; do
              if git fetch origin main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::git fetch failed after 3 attempts"
                exit 1
              fi
              echo "::warning::git fetch attempt $attempt failed; retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            git reset --hard origin/main
            # The sitemap is generated from content on disk. Remove stale
            # untracked MDX that can survive reset and keep deleted URLs live.
            git clean -fd -- content/en/posts content/en/threat-intel content/zh/posts content/zh/threat-intel

            NEW_LOCK_HASH=""
            if [ -f package-lock.json ]; then
              NEW_LOCK_HASH=$(sha256sum package-lock.json | awk '{print $1}')
            fi
            if [ ! -d node_modules ] || [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ]; then
              echo "📦 Installing dependencies (package lock changed or node_modules missing)..."
              HUSKY=0 npm ci --production=false --silent
            else
              echo "📦 Dependencies unchanged; skipping npm ci on VPS"
            fi

            echo "🔎 Regenerating public discovery artifacts..."
            npm run feed:index
            npm run search:index

            # Verify the staged build that rsync just uploaded
            test -f .next-staging/prerender-manifest.json \
              || (echo "❌ Staged build missing prerender-manifest.json — aborting, old build still serving"; exit 1)

            # Ownership self-heal: the old deploy used `sudo rm -rf .next`
            # which left the recreated .next owned by the zcybernews user
            # anyway — but if any path has drifted to root ownership from
            # earlier scripts, fix it once here so subsequent non-sudo
            # operations work. The zcybernews user has ownership of its
            # own $HOME, so this chown is a no-op normally.
            chown -R zcybernews:zcybernews .next .next-prev .next-staging 2>/dev/null || true

            echo "🔄 Atomic swap: staging → live, live → previous"
            # NO sudo — non-interactive SSH can't answer a sudo password
            # prompt (failed the first Option B deploy attempt). The
            # zcybernews user owns everything in its own home directory,
            # so rm/mv without sudo works fine.
            # If .next-prev exists from a previous deploy, move it aside
            # before the swap. Runtime image-cache files can have drifted
            # ownership, so deleting the old rollback directory synchronously
            # can fail even though the deploy itself is healthy.
            OLD_ROLLBACK=".next-prev-stale-$(date +%Y%m%d%H%M%S)"
            if [ -d .next-prev ]; then
              mv .next-prev "${OLD_ROLLBACK}" || {
                echo "❌ Could not move existing .next-prev out of the deploy path"
                exit 1
              }
            fi
            # Move current .next to .next-prev (atomic rename on ext4)
            [ -d .next ] && mv .next .next-prev
            # Move staged build to .next (atomic rename)
            mv .next-staging .next
            grep -R "Built by a cybersecurity professional" .next/server .next/static >/dev/null \
              || (echo "❌ Live .next missing expected homepage copy after swap"; exit 1)
            grep -R "Palo Alto Networks Security Advisories" .next/server .next/static >/dev/null \
              || (echo "❌ Live .next missing expected vendor source copy after swap"; exit 1)
            # The Next.js self-hosted cache lives under .next/cache.
            # Keep the compiled build, but drop runtime/prerender cache on
            # full deploy so static public pages cannot keep serving HTML
            # generated by the previous build.
            rm -rf .next/cache
            # Cleanup should never block deploy. If old cache files have
            # bad ownership, keep the stale rollback directory for manual
            # cleanup instead of failing a healthy release.
            if [ -n "${OLD_ROLLBACK:-}" ] && [ -d "${OLD_ROLLBACK}" ]; then
              rm -rf "${OLD_ROLLBACK}" 2>/dev/null || echo "⚠️ Deferred cleanup for ${OLD_ROLLBACK}"
            fi
            find . -maxdepth 1 -type d -name '.next-prev-stale-*' -mtime +2 -exec rm -rf {} + 2>/dev/null || true

            echo "♻️  Recreating PM2 process with explicit cwd..."
            # PM2 persists the original cwd from the first start. If the app
            # was ever started from an older directory, `pm2 reload` can keep
            # serving that old build even after this deploy swaps .next here.
            # Recreate on full code deploy so the runtime path is deterministic.
            pm2 delete zcybernews >/dev/null 2>&1 || true
            # Defensive cleanup: if a previous failed deploy left an orphaned
            # Next.js listener on port 3000, the new process cannot bind and
            # traffic keeps hitting stale HTML. Use port owners only. Do not
            # use broad `pkill -f` here: the remote shell command contains the
            # same strings and can kill its own SSH session.
            find_port_pids_from_proc() {
              PORT_HEX="$(printf '%04X' 3000)"
              INODES="$(awk -v port=":${PORT_HEX}" '$2 ~ port "$" && $4 == "0A" { print $10 }' /proc/net/tcp /proc/net/tcp6 2>/dev/null | sort -u || true)"
              if [ -z "$INODES" ]; then
                return 0
              fi

              for inode in $INODES; do
                for fd in /proc/[0-9]*/fd/*; do
                  target="$(readlink "$fd" 2>/dev/null || true)"
                  [ "$target" = "socket:[$inode]" ] || continue
                  pid="${fd#/proc/}"
                  pid="${pid%%/*}"
                  owner="$(ps -o user= -p "$pid" 2>/dev/null | awk '{ print $1 }')"
                  if [ "$owner" = "$(whoami)" ]; then
                    echo "$pid"
                  fi
                done
              done | sort -u
            }

            PORT_PIDS=""
            if command -v lsof >/dev/null 2>&1; then
              PORT_PIDS="$PORT_PIDS $(lsof -ti tcp:3000 2>/dev/null || true)"
            fi
            if command -v fuser >/dev/null 2>&1; then
              PORT_PIDS="$PORT_PIDS $(fuser 3000/tcp 2>/dev/null || true)"
              PORT_PIDS="$PORT_PIDS $(fuser -n tcp 3000 2>/dev/null || true)"
            fi
            PORT_PIDS="$PORT_PIDS $(find_port_pids_from_proc)"
            PORT_PIDS=$(echo "$PORT_PIDS" | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -u || true)
            if [ -n "$PORT_PIDS" ]; then
              echo "⚠️ Killing stale port 3000 listener(s): $PORT_PIDS"
              echo "$PORT_PIDS" | xargs -r kill || true
              sleep 2
              echo "$PORT_PIDS" | xargs -r kill -9 2>/dev/null || true
              sleep 1
            fi

            if command -v fuser >/dev/null 2>&1; then
              fuser -k 3000/tcp 2>/dev/null || true
              fuser -n tcp -k 3000 2>/dev/null || true
              sleep 2
            fi

            PROC_PORT_PIDS="$(find_port_pids_from_proc)"
            if [ -n "$PROC_PORT_PIDS" ]; then
              echo "⚠️ Killing stale port 3000 listener(s) found via /proc: $PROC_PORT_PIDS"
              echo "$PROC_PORT_PIDS" | xargs -r kill || true
              sleep 2
              echo "$PROC_PORT_PIDS" | xargs -r kill -9 2>/dev/null || true
              sleep 1
            fi

            echo "Runtime process snapshot before start:"
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep ':3000' || true
            ps -fu "$(whoami)" | grep -E 'next|npm|node' | grep -v grep || true

            if (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null || true) | grep -q ':3000'; then
              echo "❌ Port 3000 is still occupied after cleanup; refusing to start a divergent runtime"
              (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep ':3000' || true
              ps -fu "$(whoami)" | grep -E 'next|npm|node' | grep -v grep || true
              echo "Visible node/npm/next/pm2 process snapshot:"
              ps -eo pid,ppid,user,comm,args | grep -E '[n]ode|[n]pm|[n]ext|[p]m2|3000' || true
              echo "Port 3000 listener inodes:"
              PORT_HEX="$(printf '%04X' 3000)"
              awk -v port=":${PORT_HEX}" '$2 ~ port "$" && $4 == "0A" { print FILENAME, $0 }' /proc/net/tcp /proc/net/tcp6 2>/dev/null || true
              exit 1
            fi

            chmod +x scripts/ops/start-next-prod.sh
            # Next.js 16.x docs recommend a single `next start` process for
            # full feature fidelity. The wrapper execs Next directly so PM2
            # tracks the real server instead of an npm parent process.
            pm2 start scripts/ops/start-next-prod.sh --name zcybernews \
              --cwd /home/zcybernews/zcybernews \
              --interpreter bash \
              --max-memory-restart 750M
            pm2 save

            echo "🏥 Health check..."
            sleep 5
            for attempt in 1 2 3; do
              HTML=$(curl --connect-timeout 5 --max-time 20 -fsS http://127.0.0.1:3000/en || true)
              if echo "$HTML" | grep -q "Built by a cybersecurity professional"; then
                echo "✅ Local health check passed on attempt ${attempt}"
                break
              fi

              if [ "${attempt}" = "3" ]; then
                echo "❌ Health/content check failed after 3 attempts — recent logs:"
                echo "Expected deployed homepage copy was not found in localhost HTML."
                echo "Git HEAD: $(git rev-parse --short HEAD)"
                echo "Matching old/new strings on disk:"
                grep -R "Built by a cybersecurity professional" app components messages .next/server .next/static 2>/dev/null | head -20 || true
                grep -R "cybersecurity feeds every day" app components messages .next/server .next/static 2>/dev/null | head -20 || true
                echo "Port/process snapshot:"
                (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep ':3000' || true
                ps -fu "$(whoami)" | grep -E 'next|npm|node' | grep -v grep || true
                pm2 describe zcybernews || true
                pm2 logs zcybernews --lines 80 --nostream
                exit 1
              fi

              echo "⏳ Local health/content check attempt ${attempt} failed; retrying..."
              sleep 5
            done

            echo "🧹 Revalidating public discovery pages after full rebuild..."
            SECRET=$(grep '^REVALIDATE_SECRET=' .env.local | cut -d= -f2- || true)
            if [ -z "$SECRET" ]; then
              echo "⚠️ REVALIDATE_SECRET missing; public pages may keep serving stale cached HTML until TTL expiry"
            else
              curl -fsS -X POST -H "x-revalidate-secret: $SECRET" \
                "http://localhost:3000/api/revalidate?tag=articles&path=/en/sources&path=/zh/sources" \
                > /dev/null \
                || echo "⚠️ Post-rebuild revalidate failed; deploy is live but cache may expire naturally"
            fi

            echo "✅ Deployed $(git rev-parse --short HEAD) at $(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S SGT')"

      - name: Post-deploy smoke test — prod URL sweep
        # Added 2026-04-18 after RSC cache-poison SEV1 was detected by the
        # operator (not by our CI). Runs 10 deterministic curl checks
        # against prod — asserts 200 + correct content-type for homepages,
        # salary, articles, categories, sitemap, robots, icon, apple-icon.
        # Fails the deploy if any returns wrong content-type (e.g.
        # text/x-component for an HTML route — the RSC poisoning signature).
        # Script is operator-safe, runs in ~15s, zero external dependencies.
        # Owner: DevOps Automator. See Eric's 2026-04-18 call in ORG_CHART.
        run: bash scripts/smoke-test-prod.sh
        env:
          BASE_URL: https://zcybernews.com

      - name: Notify Telegram — deploy failure
        # Fires if any preceding step failed (build error, OOM, PM2 won't
        # start, health-check 502, etc.). Without this, code deploy
        # failures are invisible until a customer reports the site is
        # down. The pipeline workflow has a similar step; this mirrors
        # it for full code deploys.
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured — can't send deploy-failure notification"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          MESSAGE="🚨 <b>ZCyberNews FULL DEPLOY FAILED</b>"
          MESSAGE+=$'\n'"Commit: ${SHA_SHORT}"
          MESSAGE+=$'\n\n'"Run: ${RUN_URL}"
          MESSAGE+=$'\n\n'"⚠️ Site may be DOWN — check pm2 status zcybernews"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode disable_web_page_preview="true" \
            --data-urlencode text="$MESSAGE" \
            > /dev/null || true
